version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medikiosk-db
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk123
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://medikiosk:medikiosk123@postgres:5432/medikiosk
      JWT_SECRET: your-secret-key-change-in-production
      ENVIRONMENT: development
      SPEECH_PROVIDER: mock
      TTS_PROVIDER: mock
      OCR_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
